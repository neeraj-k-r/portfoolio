[build]
  # publish repo root: frontend/ serves the site, backend/ stays reachable for shared config
  publish = "."

# Security: Block direct access to database schemas, worker source, and backend config files
# Canonical SEO: Permanent 301 redirects to eliminate duplicate URLs
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/frontend/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/frontend"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/frontend/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/robots.txt"
  to = "/frontend/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/frontend/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/og-image.png"
  to = "/frontend/og-image.png"
  status = 200
  force = true

[[redirects]]
  from = "/badge.svg"
  to = "/frontend/badge.svg"
  status = 200
  force = true

[[redirects]]
  from = "/badge"
  to = "/frontend/badge.svg"
  status = 200
  force = true

[[redirects]]
  from = "/google35cbf527736916d3.html"
  to = "/frontend/google35cbf527736916d3.html"
  status = 200
  force = true

[[redirects]]
  from = "/backend/supabase-schema.sql"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/backend/wrangler.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/backend/worker.js"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/backend/*.sql"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/backend/*.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/*.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/u/:user/resume"
  to = "/frontend/?u=:user&resume=1"
  status = 200
  force = true

[[redirects]]
  from = "/u/*"
  to = "/frontend/?u=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/frontend/admin.html"
  status = 200

[[redirects]]
  from = "/developer-portfolio-maker"
  to = "/frontend/index.html"
  status = 200

[[redirects]]
  from = "/free-portfolio-hosting"
  to = "/frontend/index.html"
  status = 200

[[redirects]]
  from = "/explore"
  to = "/frontend/index.html"
  status = 200

# everything else renders from frontend/; real files (e.g. /backend/*) still serve directly
[[redirects]]
  from = "/*"
  to = "/frontend/:splat"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Security-Policy = "default-src 'self' https://*.portfoolio.me; script-src 'self' 'unsafe-inline' https://*.portfoolio.me https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://*.portfoolio.me https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://unicons.iconscout.com https://unpkg.com https://cdn.jsdelivr.net; font-src 'self' https://*.portfoolio.me https://fonts.gstatic.com https://cdnjs.cloudflare.com https://unicons.iconscout.com https://unpkg.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.portfoolio.me https://oorcivmymcokbjiawkig.supabase.co https://*.supabase.co https://res.cloudinary.com https://api.cloudinary.com https://github-contributions-api.jogruber.de https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/badge.svg"
  [headers.values]
    Content-Type = "image/svg+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/badge"
  [headers.values]
    Content-Type = "image/svg+xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"
