<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="pf-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="pf-c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="pf-p" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <!-- transparent background (matches updated logo) -->
  <!-- left + right inner faces -->
  <path d="M32 11 V53 L13.5 42.5 V21.5 Z" fill="#0f172a"/>
  <path d="M32 11 V53 L50.5 42.5 V21.5 Z" fill="#131c33"/>
  <!-- hexagon shell -->
  <path d="M32 5 L54.5 18 V46 L32 59 L9.5 46 V18 Z"
        fill="none" stroke="url(#pf-g)" stroke-width="6"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- divider -->
  <line x1="32" y1="11" x2="32" y2="53" stroke="url(#pf-g)" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
  <!-- left: code brackets </> -->
  <g fill="none" stroke="url(#pf-c)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22.5 24.5 L18 29 L22.5 33.5"/>
    <path d="M29.5 23 L25.5 35"/>
  </g>
  <!-- left: text lines -->
  <g stroke="url(#pf-c)" stroke-width="2.6" stroke-linecap="round">
    <line x1="18" y1="39" x2="29" y2="39"/>
    <line x1="18" y1="43.5" x2="27" y2="43.5"/>
  </g>
  <!-- right: sun -->
  <circle cx="43.5" cy="26.5" r="3.4" fill="url(#pf-p)"/>
  <!-- right: mountain + photo -->
  <path d="M37.5 43 L41.5 34.5 Q42.3 33 43.4 34.2 L46 37.2 Q46.9 38.2 48.2 37.6 L49.5 37 Q50.6 36.5 50.6 38.6 V41.2 Q50.6 43 48.8 43 H39.2 Q37.5 43 37.5 43 Z" fill="url(#pf-p)"/>
  <!-- right: paint brush -->
  <g stroke="#f0abfc" stroke-width="2.2" stroke-linecap="round">
    <line x1="44.5" y1="47.5" x2="49.5" y2="38.5"/>
  </g>
  <circle cx="50.2" cy="36.8" r="1.8" fill="#f0abfc"/>
</svg>
