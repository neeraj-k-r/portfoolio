<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mara Voss — Independent Art Director &amp; Digital Designer</title>
  <style>
    :root {
      --mara-bg: #000000;
      --mara-text: #ffffff;
      --mara-accent: #ff630f;
      --mara-muted: #949494;
      --mara-muted-2: #aaaaaa;
      --mara-muted-3: #b8b8b8;
      --mara-ivory: #eae5da;
      --mara-dark-div-1: #222222;
      --mara-dark-div-2: #333333;
      --mara-font-display: MonaSemi, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      --mara-font-body: Mona, Arial, sans-serif;
      --mara-font-utility: "PP Neue Montreal", Arial, sans-serif;
      --mara-ease-reveal: cubic-bezier(.44,0,.56,1);
      --mara-inset: 3%;
      --mara-inset-work: 4%;
    }
    @font-face{font-family:MonaSemi;src:url("https://cdn.jsdelivr.net/gh/github/mona-sans@main/fonts/webfonts/static/MonaSansSemiCondensed-ExtraLight.woff2") format("woff2");font-weight:250;font-style:normal;font-display:swap}
    @font-face{font-family:MonaSemi;src:url("https://cdn.jsdelivr.net/gh/github/mona-sans@main/fonts/webfonts/static/MonaSansSemiCondensed-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
    @font-face{font-family:MonaSemi;src:url("https://cdn.jsdelivr.net/gh/github/mona-sans@main/fonts/webfonts/static/MonaSansSemiCondensed-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
    @font-face{font-family:Mona;src:url("https://cdn.jsdelivr.net/gh/github/mona-sans@main/fonts/webfonts/static/MonaSans-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
  </style>
</head>
<body id="top">
  <!-- Semantic Sections: #top, #about, #featured, #work, #services, #contact -->
  <header id="hero" class="mara-hero"></header>
  <main>
    <section id="about" class="mara-about"></section>
    <section id="featured" class="mara-featured"></section>
    <section id="work" class="mara-work"></section>
    <section id="services" class="mara-services"></section>
    <section id="contact" class="mara-contact"></section>
  </main>
  <footer class="mara-footer"></footer>
</body>
</html>
