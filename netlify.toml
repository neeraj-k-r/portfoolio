[build]
  # publish repo root: frontend/ serves the site, backend/ stays reachable for shared config
  publish = "."

[[redirects]]
  from = "/u/:user/resume"
  to = "/frontend/?u=:user&resume=1"
  status = 200
  force = true

[[redirects]]
  from = "/u/*"
  to = "/frontend/?u=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/frontend/admin.html"
  status = 200

[[redirects]]
  from = "/explore"
  to = "/frontend/index.html"
  status = 200

# everything else renders from frontend/; real files (e.g. /backend/*) still serve directly
[[redirects]]
  from = "/*"
  to = "/frontend/:splat"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Security-Policy = "default-src 'self' https://*.portfoolio.me; script-src 'self' 'unsafe-inline' https://*.portfoolio.me https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://*.portfoolio.me https://fonts.googleapis.com https://fonts.gstatic.com https://cdnjs.cloudflare.com https://unicons.iconscout.com https://unpkg.com https://cdn.jsdelivr.net; font-src 'self' https://*.portfoolio.me https://fonts.gstatic.com https://cdnjs.cloudflare.com https://unicons.iconscout.com https://unpkg.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.portfoolio.me https://oorcivmymcokbjiawkig.supabase.co https://*.supabase.co https://res.cloudinary.com https://api.cloudinary.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
